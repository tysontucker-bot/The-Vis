<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Bathroom" />
  <meta name="theme-color" content="#FFD54F" />
  <title>Bathroom</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚻%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{ --bg:#8BC34A; --yellow:#FFD54F; --border:#000; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; }
    body{
      min-height:100vh; min-height:100dvh; background:var(--bg);
      font-family:Nunito, Arial, sans-serif; color:#111;
      padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
    }
    header{
      position:sticky; top:0; z-index:5; background:var(--yellow);
      border-bottom:5px solid var(--border); padding:12px 16px;
      padding-top:calc(12px + env(safe-area-inset-top,0px)); margin-top:calc(-1 * env(safe-area-inset-top,0px));
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    h1{ margin:0; font-size:1.4rem; font-weight:900; }
    .sync{ font-size:.85rem; font-weight:800; color:#444; text-align:right; }
    .sync[data-state="error"]{ color:#b71c1c; }
    main{ padding:14px; display:flex; flex-direction:column; gap:12px; max-width:560px; margin:0 auto; }
    .student{
      background:#fff; border:5px solid var(--border); border-radius:18px;
      display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; padding:12px 12px 12px 14px;
    }
    .student[data-status="soon"]{ background:#FFC107; border-color:#8a5a00; }
    .student[data-status="soon"] .time::before{ content:"⏰ "; }
    .student[data-status="soon"] .last{ color:#3d2a00; }
    .student[data-status="soon"] .done{ background:#fff; }
    .student[data-status="overdue"]{ background:#ffe1e1; }
    .who{ display:flex; flex-direction:column; gap:6px; min-width:0; }
    .chip{
      align-self:flex-start; color:#fff; font-weight:900; font-size:1.3rem;
      padding:2px 14px; border-radius:999px;
    }
    .time{ font-weight:900; font-size:1.15rem; font-variant-numeric:tabular-nums; }
    .student[data-status="overdue"] .time{ color:#c62828; }
    .student[data-status="waiting"] .time{ color:#666; font-size:1rem; }
    .last{ font-size:.85rem; font-weight:700; color:#555; }
    .done{
      font:inherit; font-weight:900; font-size:1.15rem; min-width:118px; min-height:64px;
      border:4px solid var(--border); border-radius:14px; background:var(--yellow); color:#111;
      cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    }
    .done:active{ transform:scale(.97); }
    .done:disabled{ opacity:.6; }
    .done:focus-visible{ outline:4px solid #1565c0; outline-offset:3px; }
    .toast{
      position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
      background:#111; color:#fff; font-weight:800; padding:12px 18px; border-radius:999px;
      box-shadow:0 4px 14px rgba(0,0,0,.3); max-width:92vw; text-align:center;
      opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .toast.show{ opacity:1; }
    .message{ background:#fff; border:5px solid var(--border); border-radius:18px; padding:20px; font-weight:800; text-align:center; }
    /* Log form (bottom sheet) */
    .sheet-backdrop{
      position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.45);
      display:flex; align-items:flex-end; justify-content:center;
    }
    .sheet-backdrop[hidden]{ display:none; }
    .sheet{
      width:min(560px, 100%); max-height:92vh; max-height:92dvh; overflow:auto;
      background:#fff; border:5px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));
    }
    .sheet-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .sheet-head .chip{ align-self:center; }
    .sheet-time{ font-weight:900; font-size:1.1rem; }
    .group-label{ font-weight:900; font-size:.95rem; margin:12px 2px 6px; }
    .tiles{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
    .where-row{ display:grid; grid-template-columns:86px 1fr; align-items:center; gap:8px; margin-top:10px; }
    .where-label{ font-weight:900; font-size:1rem; display:flex; align-items:center; gap:4px; }
    .where-label .ico{ font-size:1.4rem; }
    .picks[data-group="void"], .picks[data-group="bm"]{ display:grid; grid-template-columns:repeat(3, 1fr); }
    .picks[data-group="void"] .pick, .picks[data-group="bm"] .pick{ min-width:0; min-height:52px; font-size:.95rem; padding:4px 2px; }
    .tile{
      font:inherit; font-weight:800; font-size:.78rem; line-height:1.1;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      min-height:78px; padding:6px 2px; border:3px solid var(--border); border-radius:12px;
      background:#fff; color:#111; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    }
    .tile .ico{ font-size:1.6rem; line-height:1; }
    .tile[aria-pressed="true"]{ background:var(--yellow); box-shadow:inset 0 0 0 3px #111; }
    .tile:focus-visible, .pick:focus-visible, .sheet-actions button:focus-visible{ outline:4px solid #1565c0; outline-offset:2px; }
    .picks{ display:flex; flex-wrap:wrap; gap:6px; }
    .pick{
      font:inherit; font-weight:900; font-size:1rem; min-height:48px; min-width:56px; padding:4px 12px;
      border:3px solid var(--border); border-radius:12px; background:#fff; color:#111; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; justify-content:center; touch-action:manipulation;
    }
    .picks[data-group="prompt"]{ display:grid; grid-template-columns:repeat(5, 1fr); }
    .picks[data-group="prompt"] .pick{ min-width:0; padding:4px 2px; }
    .pick, .tile{ -webkit-tap-highlight-color:transparent; }
    .pick small{ font-size:.66rem; font-weight:800; }
    .pick[aria-pressed="true"]{ background:var(--yellow); box-shadow:inset 0 0 0 3px #111; }
    .auto-n{ margin-top:10px; font-weight:900; color:#6a1b9a; }
    .auto-n[hidden]{ display:none; }
    .sheet-actions{ display:grid; grid-template-columns:1fr 2fr; gap:10px; margin-top:16px; }
    .sheet-actions button{
      font:inherit; font-weight:900; font-size:1.1rem; min-height:56px;
      border:4px solid var(--border); border-radius:14px; cursor:pointer;
    }
    .btn-cancel{ background:#fff; }
    .btn-save{ background:#43a047; color:#fff; }
    .btn-save:disabled{ background:#cfd8cf; color:#555; cursor:not-allowed; }
    .tip{ font-size:.9rem; font-weight:700; color:#222; text-align:center; padding:4px 10px 16px; }
  </style>
</head>
<body>
  <header>
    <h1>🚻 Bathroom</h1>
    <div class="sync" id="sync" aria-live="polite">Connecting…</div>
  </header>
  <main id="list"></main>
  <div class="tip" id="tip">Tap <b>Done</b>, choose what happened, then <b>Save</b>.</div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <span class="chip" id="sheetChip"></span>
        <span class="sheet-time" id="sheetTitle"></span>
      </div>

      <div class="group-label">What happened? <span style="font-weight:700">(tap all that apply)</span></div>
      <div class="tiles" id="tiles">
        <button class="tile" data-field="sat" aria-pressed="false"><span class="ico">🚽</span>Sat</button>
        <button class="tile" data-field="dry" aria-pressed="false"><span class="ico">☀️</span>Dry Pull-Up</button>
        <button class="tile" data-field="pullup" aria-pressed="false"><span class="ico">🩲</span>Changed Pull-Up</button>
        <button class="tile" data-field="accident" aria-pressed="false"><span class="ico">🚫</span>Accident</button>
      </div>

      <div class="where-row">
        <div class="where-label"><span class="ico">💧</span>Voided</div>
        <div class="picks" data-group="void" role="group" aria-label="Voided where">
          <button class="pick" data-value="toilet" aria-pressed="false">Toilet</button>
          <button class="pick" data-value="pullup" aria-pressed="false">Pull-Up</button>
          <button class="pick" data-value="both" aria-pressed="false">Both</button>
        </div>
      </div>
      <div class="where-row">
        <div class="where-label"><span class="ico">💩</span>BM</div>
        <div class="picks" data-group="bm" role="group" aria-label="BM where">
          <button class="pick" data-value="toilet" aria-pressed="false">Toilet</button>
          <button class="pick" data-value="pullup" aria-pressed="false">Pull-Up</button>
          <button class="pick" data-value="both" aria-pressed="false">Both</button>
        </div>
      </div>
      <div class="auto-n" id="autoN" hidden>N — Did not go in toilet (logged automatically)</div>

      <div id="stoolGroup" hidden>
        <div class="group-label">Stool</div>
        <div class="picks" data-group="stool">
          <button class="pick" data-value="" aria-pressed="true">Normal</button>
          <button class="pick" data-value="LS1" aria-pressed="false">LS1<small>Loose</small></button>
          <button class="pick" data-value="LS2" aria-pressed="false">LS2<small>Diarrhea</small></button>
        </div>
      </div>

      <div class="group-label">Prompt level</div>
      <div class="picks" data-group="prompt">
        <button class="pick" data-value="I" aria-pressed="false">I<small>Indep.</small></button>
        <button class="pick" data-value="VM" aria-pressed="false">VM<small>Visual</small></button>
        <button class="pick" data-value="V" aria-pressed="false">V<small>Verbal</small></button>
        <button class="pick" data-value="G" aria-pressed="false">G<small>Gestural</small></button>
        <button class="pick" data-value="P" aria-pressed="false">P<small>Physical</small></button>
      </div>

      <div class="sheet-actions">
        <button class="btn-cancel" id="btnCancel">Cancel</button>
        <button class="btn-save" id="btnSave" disabled>Save</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const POLL_MS = 15000, WARN_MIN = 15;
    const $ = id => document.getElementById(id);
    let config = null, serverLast = {}, lastSync = null;

    // The setup link carries everything this page needs, so a home-screen shortcut keeps working on its own
    function readConfig(){
      const q = new URLSearchParams(location.search);
      const e = q.get("e") || "", k = q.get("k"), s = q.get("s");
      if (!e || !k || s === null) return null;
      const endpoint = /^[\w-]+$/.test(e) ? `https://script.google.com/macros/s/${e}/exec` : e;
      if (!/^https:\/\/script\.google\.com\//.test(endpoint)) return null;
      const students = s ? s.split("*").map(part => {
        const [id, label, color] = part.split(".");
        return { id, label: label || id, color: /^[0-9a-f]{6}$/i.test(color || "") ? "#" + color : "#1e88e5" };
      }).filter(x => x.id) : [];
      return { endpoint, key: k, intervalMin: Number(q.get("i")) > 0 ? Number(q.get("i")) : 120, students };
    }

    function ctParts(d){
      const parts = new Intl.DateTimeFormat("en-US", { timeZone:"America/Chicago", hour:"2-digit", minute:"2-digit", hour12:false }).formatToParts(d);
      const get = t => parseInt(parts.find(p => p.type === t)?.value || "0", 10);
      return { hour: get("hour") % 24, minute: get("minute") };
    }
    function midnightCT(now){
      const ct = ctParts(now);
      return Math.floor(now.getTime() / 60000) * 60000 - (ct.hour * 60 + ct.minute) * 60000;
    }
    function clock(ms){
      return new Intl.DateTimeFormat("en-US", { timeZone:"America/Chicago", hour:"numeric", minute:"2-digit" }).format(new Date(ms));
    }
    function formatRemaining(ms){
      if (ms <= 0) { const over = Math.floor(-ms / 60000); return over < 1 ? "Due now" : `${over} min over`; }
      const t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
      return h > 0 ? `Due in ${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `Due in ${m}:${String(s).padStart(2,"0")}`;
    }

    async function request(params){
      const url = new URL(config.endpoint);
      Object.entries({ ...params, key: config.key }).forEach(([k, v]) => url.searchParams.set(k, v));
      const res = await fetch(url.toString(), { cache: "no-store" });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "error");
      serverLast = data.last || {};
      lastSync = Date.now();
      return data;
    }

    function setSync(text, state){
      $("sync").textContent = text;
      $("sync").dataset.state = state || "";
    }

    async function poll(){
      if (document.hidden) return;
      try {
        await request({ action: "state" });
        setSync(`Updated ${clock(lastSync)}`);
      } catch (err) {
        setSync(err.message === "wrong-code" ? "Code doesn't match — set up again" : "Offline — retrying", "error");
      }
      render();
    }

    function build(){
      const list = $("list");
      list.innerHTML = "";
      config.students.forEach(s => {
        const card = document.createElement("section");
        card.className = "student";
        card.dataset.id = s.id;
        card.innerHTML = `<div class="who"><span class="chip"></span><span class="time"></span><span class="last"></span></div><button class="done">✓ Done</button>`;
        card.querySelector(".chip").textContent = s.label;
        card.querySelector(".chip").style.background = s.color;
        const btn = card.querySelector(".done");
        btn.setAttribute("aria-label", `Log bathroom trip for ${s.label}`);
        btn.addEventListener("click", () => onDone(s));
        list.appendChild(card);
      });
    }

    function render(){
      const now = new Date(), midnight = midnightCT(now), intervalMs = config.intervalMin * 60000;
      config.students.forEach(s => {
        const card = document.querySelector(`[data-id="${CSS.escape(s.id)}"]`);
        if (!card) return;
        const last = Date.parse(serverLast[s.id] || "") || 0;
        if (last < midnight) {
          card.dataset.status = "waiting";
          card.querySelector(".time").textContent = "No trip yet today";
          card.querySelector(".last").textContent = "";
          return;
        }
        const remaining = last + intervalMs - now.getTime();
        card.dataset.status = remaining <= 0 ? "overdue" : remaining <= WARN_MIN * 60000 ? "soon" : "ok";
        card.querySelector(".time").textContent = formatRemaining(remaining);
        card.querySelector(".last").textContent = `Last: ${clock(last)}`;
      });
    }

    /* ---------- log form ---------- */
    let formStudent = null;
    const form = { sat:false, dry:false, void:"", bm:"", pullup:false, accident:false, stool:"", prompt:"" };
    const inPullUp = where => where === "pullup" || where === "both";
    const inToilet = where => where === "toilet" || where === "both";

    function onDone(s){
      formStudent = s;
      Object.assign(form, { sat:false, dry:false, void:"", bm:"", pullup:false, accident:false, stool:"", prompt:"" });
      $("sheetChip").textContent = s.label;
      $("sheetChip").style.background = s.color;
      $("sheetTitle").textContent = clock(Date.now());
      syncForm();
      $("sheetBackdrop").hidden = false;
      document.querySelector(".tile").focus();
    }

    function closeForm(){
      $("sheetBackdrop").hidden = true;
      formStudent = null;
    }

    function syncForm(){
      document.querySelectorAll(".tile").forEach(t => t.setAttribute("aria-pressed", String(form[t.dataset.field])));
      document.querySelectorAll(".picks").forEach(g => {
        const value = form[g.dataset.group];
        g.querySelectorAll(".pick").forEach(p => p.setAttribute("aria-pressed", String(p.dataset.value === value)));
      });
      $("stoolGroup").hidden = !form.bm;
      $("autoN").hidden = !(form.sat && !inToilet(form.void) && !inToilet(form.bm));
      $("btnSave").disabled = !(form.sat || form.dry || form.void || form.bm || form.pullup || form.accident);
    }

    document.querySelectorAll(".tile").forEach(t => t.addEventListener("click", () => {
      form[t.dataset.field] = !form[t.dataset.field];
      // A dry pull-up can't also be wet or soiled: keep only the toilet part
      if (t.dataset.field === "dry" && form.dry) {
        ["void", "bm"].forEach(g => { if (form[g] === "pullup") form[g] = ""; else if (form[g] === "both") form[g] = "toilet"; });
        if (!form.bm) form.stool = "";
      }
      syncForm();
    }));
    document.querySelectorAll(".picks").forEach(g => g.querySelectorAll(".pick").forEach(p => p.addEventListener("click", () => {
      const group = g.dataset.group;
      const value = p.dataset.value;
      if (group === "stool") {
        form.stool = value;
      } else {
        // Voided, BM and prompt: tap the selected choice again to clear it
        form[group] = form[group] === value ? "" : value;
      }
      if (group === "bm" && !form.bm) form.stool = "";
      // Going in the pull-up usually means it was changed; still tappable to undo
      if ((group === "void" || group === "bm") && inPullUp(form[group])) { form.pullup = true; form.dry = false; }
      syncForm();
    })));
    $("btnCancel").addEventListener("click", closeForm);
    $("sheetBackdrop").addEventListener("click", e => { if (e.target === $("sheetBackdrop")) closeForm(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheetBackdrop").hidden) closeForm(); });

    $("btnSave").addEventListener("click", async () => {
      if (!formStudent) return;
      const s = formStudent, btn = $("btnSave");
      btn.disabled = true;
      btn.textContent = "Saving…";
      const params = { action:"reset", student:s.id, label:s.label, source:"phone" };
      ["sat", "dry", "pullup", "accident"].forEach(f => { if (form[f]) params[f] = "1"; });
      if (form.void) params.void = form.void;
      if (form.bm) params.bm = form.bm;
      if (form.bm && form.stool) params.stool = form.stool;
      if (form.prompt) params.prompt = form.prompt;
      try {
        await request(params);
        closeForm();
        toast(`✓ ${s.label} logged at ${clock(Date.now())}`);
        setSync(`Updated ${clock(lastSync)}`);
        if (navigator.vibrate) navigator.vibrate(40);
      } catch (err) {
        toast(err.message === "wrong-code" ? "Not saved: code doesn't match" : "Not saved: no connection. Try again.");
      }
      btn.textContent = "Save";
      syncForm();
      render();
    });

    let toastTimer;
    function toast(text){
      const t = $("toast");
      t.textContent = text;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
    }

    config = readConfig();
    if (!config) {
      $("list").innerHTML = `<div class="message">This phone isn't set up yet.<br><br>On the board, open Settings → Set up bathroom timers → Set up a phone, and scan that code.</div>`;
      $("tip").hidden = true;
      setSync("");
    } else if (!config.students.length) {
      $("list").innerHTML = `<div class="message">No students yet. Add students on the board, then set up this phone again.</div>`;
      $("tip").hidden = true;
    } else {
      build();
      render();
      poll();
      setInterval(render, 1000);
      setInterval(poll, POLL_MS);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
    }
  </script>
</body>
</html>
